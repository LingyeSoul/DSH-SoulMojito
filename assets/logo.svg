<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="-90 -100 180 190">
  <g>
    <!-- 杯身填充（在酒液下层） -->
    <path d="M-58,-78 C-58,-20 -34,10 0,10 C34,10 58,-20 58,-78 Z"
          fill="#e8f6ee" fill-opacity="0.14"/>
    <!-- 饮品（贴内壁，略嵌入描边，由上层描边覆盖） -->
    <path d="M-54.3,-52 C-54.3,-21 -32.4,8.1 0,8.1 C32.4,8.1 54.3,-21 54.3,-52 Z" fill="#2f9e77"/>
    <!-- 冰块 -->
    <rect x="-30" y="-38" width="18" height="18" rx="3" fill="#dff3e6" opacity="0.75" transform="rotate(18 -21 -29)"/>
    <rect x="6" y="-22" width="15" height="15" rx="3" fill="#dff3e6" opacity="0.7" transform="rotate(-12 13 -14)"/>
    <!-- 气泡 -->
    <circle cx="-12" cy="-58" r="3.5" fill="#dff3e6" opacity="0.9"/>
    <circle cx="18" cy="-46" r="2.5" fill="#dff3e6" opacity="0.8"/>
    <circle cx="0" cy="-34" r="2" fill="#dff3e6" opacity="0.7"/>
    <!-- 杯身描边（最上层，盖住酒液边缘） -->
    <path d="M-58,-78 C-58,-20 -34,10 0,10 C34,10 58,-20 58,-78 Z"
          fill="none" stroke="#8fd14f" stroke-width="5"/>
    <!-- 杯脚 -->
    <path d="M0,10 L0,58 M-22,58 L22,58" stroke="#8fd14f" stroke-width="5" stroke-linecap="round"/>
    <!-- 薄荷叶 -->
    <g transform="translate(-14,-66) rotate(-38)">
      <path d="M0,0 C10,-12 30,-14 42,-4 C32,6 10,8 0,0 Z" fill="#3EB489"/>
    </g>
  </g>
</svg>
