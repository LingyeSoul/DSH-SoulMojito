# dsh-soulmojito 官方 bundle：挂载本包 Node half + client half。
- insert:
    - id: dsh-soulmojito
      name: 'dsh-soulmojito'

# Agent preset 声明（DSH 0.2.0 起的投递方式）：registry 不再扫描
# ~/.dsh/.agent-presets 目录，preset 改为 profile 里的 @deepseek-ai/
# dsh-agent-preset 声明行（见该包 README："the registry neither scans
# directories nor accepts preset paths"）。config 字段直接映射旧
# preset.yml（name/description/order）与旧 agent.cordis.yml 条目表
# （plugins）；插件运行时通过 ctx.agentPresets.recompose(agent.ctx, id)
# 按 config.id 挂载，签名与 0.1.5 相同。dsh-soulmojito/agent 与
# dsh-soulmojito/novel 只 inject 不 provide，无 isolate group 必要（registry
# 的泄漏审计只针对发布服务的行）。用户要改写本声明时，在 profile 的
# cordis.patch.yml 里按 preset-agent-tavern / preset-agent-novel 的 id 覆写。
- insert:
    - id: preset-agent-tavern
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: agent-tavern
        name: AgentTavern
        description: 原生 DSH AgentLoop 角色扮演，会话级 Tavern 工具与作用域记忆。
        order: 10
        plugins:
          - id: dsh-soulmojito-agent
            name: 'dsh-soulmojito/agent'

    - id: preset-agent-novel
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: agent-novel
        name: AgentNovel
        description: 原生 DSH AgentLoop 全自动小说推演，作者 Agent 与领域工具，先存大纲再分单元写作。
        order: 11
        plugins:
          - id: dsh-novel-author
            name: 'dsh-soulmojito/novel'

    - id: preset-card-workbench
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: card-workbench
        name: CardWorkbench
        description: 卡片工作台：对话式修改人物卡，先逐字段方案、用户确认后写入，原版快照可恢复。
        order: 12
        plugins:
          - id: dsh-card-workbench
            name: 'dsh-soulmojito/card-workbench'
          # DSH 默认文件工具行（决策 2026-10-11-workbench-reference-read v2）：
          # web 面把 agent 工具行整体下放给 preset（dsh-web-app cordis.patch.yml
          # 禁 tool-fs 等，各 session 挂 preset 自带），standard preset 挂的就是
          # 这行——对话框附件管线（原生 [File …] 句柄 + dsh-rider 📎 清单行）
          # 都指引模型「用 file tools 按路径读取」。与 standard 同款行、同款
          # 零配置；不带 fs-search（读取够了，发现面不进工作台）。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

    # 内部推理组合（DSH 0.2.1+）：spawn 子代理的 per-spawn toolFilter 被宿主
    # 删除后，无工具隔离改由独立 preset 承担。tavern_deduce 与 AgentNovel 的
    # W1 纯产稿子代理按 id 选择本组合；preset 内只有 reasoning 模块，它在挂载
    # 域 restrict 掉全部宿主全局工具。不要在 UI 里把它当普通角色预设使用。
    - id: preset-agent-reasoning
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: agent-reasoning
        name: AgentReasoning
        description: 内部无工具推理子代理（tavern_deduce 与小说纯产稿隔离环境）。
        order: 13
        plugins:
          - id: dsh-soulmojito-reasoning
            name: 'dsh-soulmojito/reasoning'

# compaction curator：替换 dsh-base 的 compaction 后端（本 bundle 在
# dsh-base/dsh-web-app 之后加载，patch 后写胜出）。宿主 patch 方言里覆写项
# 的 `name` 是"条目当前模块名"守卫——不匹配只告警跳过、并不能改模块，所以
# 换引擎必须"停旧入口 + insert 新入口"，不能 `- id: compaction-basic
# name: 'dsh-soulmojito/compaction'`（真机会报 name mismatch 并跳过，web profile
# 因此没有任何 compaction 服务，dsh-soulmojito 的 inject 永远 pending）。仅覆写
# 摘要器：AgentTavern 绑定会话用 RP 检查点模板，其余会话原样透传 basic 默认
# 行为；触发时机、保留预算与工具结果修剪全部复用宿主实现。`/compact` 命令
# 与 overflow recovery 是后端无关的，自动跟随本服务。回退：在 profile
# cordis.patch.yml 用 `- id: tavern-compaction disabled: true` 加
# `- id: compaction-basic disabled: false` 覆写回来。
- id: compaction-basic
  disabled: true

- insert:
    - id: tavern-compaction
      name: 'dsh-soulmojito/compaction'
